{# [v2] 임시저장 Floating Bubble — 시안 C #}
{# 사용:
   {% include 'partials/draft_bubble.html' %}
   <script>mountDraftBubble({page: 'new'});</script>
   페이지: 'new' | 'migrate'
#}
<style>
  .draft-fab { position: fixed; right: 20px; bottom: 20px; background: #f59e0b; color: #fff; padding: 12px 16px; border-radius: 18px; font-size: 12px; font-weight: 700; cursor: pointer;  display: flex; align-items: center; gap: 8px; z-index: 1000; transition: transform 0.15s; }
  .draft-fab:hover { transform: translateY(-2px); }
  .draft-fab .badge { background: var(--surface,#ffffff); color: #f59e0b; border-radius: 12px; padding: 0px 8px; font-size: 14px; }
  .draft-fab.empty { background: var(--바탕-흐리게, var(--faint,#94a3b8));  }
  .draft-fab.empty .badge { color: var(--글자-희미, var(--faint,#94a3b8)); }
  .draft-popup { position: fixed; right: 20px; bottom: 70px; width: 340px; max-height: 60vh; overflow-y: auto; background: var(--surface,#ffffff); border: 1px solid var(--line2,#e5e7eb); border-radius: 12px;  padding: 12px; z-index: 1001; display: none; }
  .draft-popup.open { display: block; }
  .draft-popup h3 { font-size: 14px; margin: 0 0 8px; color: var(--글자-주황, var(--amber,#92400e)); display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--line2,#f3f4f6); }
  .draft-popup .closex { background: none; border: 0; cursor: pointer; font-size: 17px; color: var(--sub,#6b7280); }
  .draft-row { padding: 8px 12px; border-radius: 8px; background: var(--연한-주황,#fff8f1); border: 1px solid var(--연한-주황,#fde4c5); margin-bottom: 8px; font-size: 12px; }
  .draft-row .draft-meta { font-size: 14px; color: var(--글자-주황, var(--amber,#92400e)); margin-bottom: 4px; }
  .draft-row .draft-key { font-family: ui-monospace, monospace; color: #1f2937; font-weight: 600; word-break: break-all; }
  .draft-row .draft-actions { display: flex; gap: 4px; margin-top: 8px; }
  .draft-row .draft-actions a, .draft-row .draft-actions button { padding: 4px 8px; border: 1px solid var(--연한-주황,#fde4c5); background: var(--surface,#ffffff); border-radius: 8px; font-size: 14px; cursor: pointer; text-decoration: none; color: var(--글자-주황, var(--amber,#92400e)); }
  .draft-row .draft-actions a:hover, .draft-row .draft-actions button:hover { background: var(--연한-주황,#fef3e2); }
  .draft-empty { text-align: center; color: var(--글자-희미, var(--faint,#9ca3af)); font-size: 14px; padding: 16px 0; }
</style>
<div id="draft-fab" class="draft-fab" style="display:none"><i class="ph-light ph-floppy-disk" aria-hidden="true"></i> 임시저장 <span class="badge" id="draft-fab-count">0</span></div>
<div id="draft-popup" class="draft-popup">
  <h3><i class="ph-light ph-floppy-disk" aria-hidden="true"></i> 임시저장 작업
    <button class="closex" onclick="document.getElementById('draft-popup').classList.remove('open')"><i class="ph-light ph-x" aria-hidden="true"></i></button>
  </h3>
  <div id="draft-popup-body"></div>
</div>
