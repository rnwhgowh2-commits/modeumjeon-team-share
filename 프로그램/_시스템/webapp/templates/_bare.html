<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}모음전{% endblock %}</title>
  <style>
    html,body{margin:0;background:var(--surface,#ffffff);
      font-family:'Pretendard','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
      -webkit-font-smoothing:antialiased;}
  </style>
  {# 팝업창 크기 드래그 조절 — iframe(bare) 안 팝업에도 동일 적용 #}
  <link rel="stylesheet" href="{{ url_for('static', filename='modal_resize.css') }}?v=20260723_mrz2">
{# [2026-08-03] 표 정렬 — 머리글·내용 둘 다 가운데 (사장님 확정 「1-C」).
   base.html 을 안 물려받는 독립 화면이라 여기에도 따로 싣는다. #}
{# [2026-08-03] 글꼴 한 벌 — 화면마다 굴림체·맑은 고딕으로 갈리던 것을 Pretendard 로.
   라이브 실측 131개 화면 중 40곳이 규칙 밖 글꼴이었다. #}
<link rel="stylesheet" href="{{ url_for('static', filename='font_unify.css') }}?v={{ STATIC_VER|default('') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='table_align.css') }}?v={{ STATIC_VER|default('') }}">
<script src="{{ url_for('static', filename='table_align.js') }}?v={{ STATIC_VER|default('') }}" defer></script>
</head>
<body>
{% block content %}{% endblock %}
<script src="{{ url_for('static', filename='modal_resize.js') }}?v=20260723_mrz2"></script>
</body>
</html>
