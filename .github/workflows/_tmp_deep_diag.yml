name: 배포 정체 심층진단(수동)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/ls_key
          chmod 600 ~/.ssh/ls_key
      - name: 심층 진단
        run: |
          ssh -i ~/.ssh/ls_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            ubuntu@"${{ secrets.LIGHTSAIL_HOST }}" '
              echo "═════ SSH 연결(22번 포트) 목록 ═════"
              sudo ss -tnp 2>/dev/null | grep ":22 " || echo "(없음)"
              echo "═════ build.log 마지막 40줄 ═════"
              tail -40 /tmp/build.log 2>/dev/null || echo "(build.log 없음)"
              echo "═════ build.log 수정시각 ═════"
              stat -c "%y" /tmp/build.log 2>/dev/null || echo "(없음)"
              echo "═════ ~/app 디렉터리 최근 수정시각 ═════"
              stat -c "%y %n" ~/app 2>/dev/null || echo "(없음)"
              find ~/app -newermt "10 minutes ago" 2>/dev/null | head -5 || true
              echo "═════ docker ps -a (전체, 정지분 포함) ═════"
              sudo docker ps -a
              echo "═════ 고아 프로세스 트리(12:14 시작 PID 계열) ═════"
              ps -ef --forest 2>/dev/null | grep -B2 -A2 "gunicorn" | head -60
              echo "═════ sshd 프로세스 (GitHub 러너발 세션 확인) ═════"
              ps -ef | grep -i "sshd:" | grep -v grep
              echo "═════ 도커 이미지 목록(빌드 완료 여부) ═════"
              sudo docker images modeumjeon --format "{{.Repository}} {{.Tag}} {{.CreatedAt}}"
            '
