<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>디자인 규칙 동작 확인</title>
<link rel="stylesheet" href="../프로그램/_시스템/webapp/static/tokens.css">
<style>body{font-family:Pretendard,system-ui,sans-serif;padding:24px}</style>
</head><body>
<h1 id="t">디자인 규칙 동작 확인</h1>

<div id="밝은" class="ds" style="padding:var(--sp-5);border-radius:var(--r-카드)">
  <div class="ds-화면제목">주문내역</div>
  <div class="ds-본문">밝은 화면 — class="ds"</div>
  <span class="ds-배지" style="color:var(--상태-준비)">배송준비중</span>
  <span class="ds-배지" style="color:var(--상태-완료)">구매확정</span>
  <span class="ds-배지" style="color:var(--상태-클레임완료)">취소완료</span>
  <table style="margin-top:var(--sp-4)">
    <thead><tr><th class="txt">상품명</th><th class="num">단가</th>
      <th class="num">매입가 (올릴 때 / 지금)</th><th class="ctr">상태</th></tr></thead>
    <tbody>
      <tr><td class="txt">나이키 에어 줌 페가수스 41</td><td class="num">139,000<span class="단위">원</span></td>
        <td class="num"><span class="ds-비교"><span class="전">98,000</span><span class="화살표">→</span>
          <span class="후" style="color:var(--변동-감소)">104,500</span></span></td>
        <td class="ctr"><span class="ds-배지" style="color:var(--상태-준비)">배송준비중</span></td></tr>
      <tr><td class="txt">뉴발란스 993</td><td class="num">329,000<span class="단위">원</span></td>
        <td class="num"><span class="ds-비교"><span class="전">241,000</span><span class="화살표">→</span>
          <span class="후" style="color:var(--변동-손해)">268,000</span></span></td>
        <td class="ctr"><span class="ds-배지" style="color:var(--상태-준비)">배송준비중</span></td></tr>
    </tbody>
  </table>
</div>

<div id="어두운" class="ds ds-dark" style="margin-top:var(--sp-5);padding:var(--sp-5);border-radius:var(--r-카드)">
  <div class="ds-화면제목">주문내역</div>
  <div class="ds-본문">어두운 화면 — class="ds ds-dark"</div>
  <div class="ds-카드" style="margin-top:var(--sp-4)">
    <div class="ds-카드제목">이번 달 마진</div>
    <div class="ds-요약숫자">164,900</div>
  </div>
</div>
</body></html>
